services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    user: "0:0"
    ports:
      - "8077:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - NEXTAUTH_URL=https://thi.easupso.com
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-easup_super_secret_production_2026}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - DATABASE_URL=postgresql://${DB_USER:-admin_easup}:${DB_PASSWORD:-change_me_32_chars_bitwarden}@db:5432/${DB_NAME:-cuocthi_easup_db}
    volumes:
      - ./data:/app/data
      - ./public/uploads:/app/public/uploads
      - tts_storage:/app/storage/tts
      - uploads_storage:/app/storage/uploads
    networks:
      - internal_net
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-admin_easup}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change_me_32_chars_bitwarden}
      POSTGRES_DB: ${DB_NAME:-cuocthi_easup_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-admin_easup} -d ${DB_NAME:-cuocthi_easup_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
  tts_storage:
    driver: local
  uploads_storage:
    driver: local

networks:
  internal_net:
    driver: bridge
