services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    environment:
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      - NEXTAUTH_URL=${NEXTAUTH_URL}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - VBEE_APP_ID=${VBEE_APP_ID}
      - VBEE_ACCESS_TOKEN=${VBEE_ACCESS_TOKEN}
      - VBEE_VOICE_CODE=${VBEE_VOICE_CODE}
      - NODE_ENV=production
    volumes:
      - tts_storage:/app/storage/tts
      - uploads_storage:/app/storage/uploads
    networks:
      - internal_net
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-admin_easup}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change_me_32_chars_bitwarden}
      POSTGRES_DB: ${DB_NAME:-cuocthi_easup_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-admin_easup} -d ${DB_NAME:-cuocthi_easup_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Bảo mật tuyệt đối: KHÔNG mở port 5432 ra Internet/Host

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - internal_net
    depends_on:
      - web

  dozzle:
    image: amir20/dozzle:latest
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "8888:8080"
    networks:
      - internal_net

volumes:
  postgres_data:
    driver: local
  tts_storage:
    driver: local
  uploads_storage:
    driver: local

networks:
  internal_net:
    driver: bridge
